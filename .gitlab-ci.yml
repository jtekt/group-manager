stages:
  - build
  - test
  - release
  - deploy

variables:
  APPLICATION_NAME: group-manager
  CONTAINER_REGISTRY: ${AWS_ECR_PUBLIC_URL}
  CONTAINER_IMAGE: ${CONTAINER_REGISTRY}/${APPLICATION_NAME}
  CONTAINER_IMAGE_TEST: ${CONTAINER_IMAGE}:test
  CONTAINER_IMAGE_LATEST: ${CONTAINER_IMAGE}:latest
  CONTAINER_IMAGE_TAGGED: ${CONTAINER_IMAGE}:${CI_COMMIT_TAG}

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    # Create repository in ECR if it does not exist yet
    - >
      aws ecr-public create-repository --region us-east-1 --repository-name ${APPLICATION_NAME}
      || echo "Repository might have already existed"
  script:
    - docker build --build-arg APP_VERSION=${CI_COMMIT_TAG} -t ${CONTAINER_IMAGE_TEST} .
    - docker push ${CONTAINER_IMAGE_TEST}

test:
  stage: test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    # Creating network for TDD
    - docker network create tdd
    # Creating DB container in network
    - >
      docker run
      -d
      --rm
      --name tdd-db
      --network tdd
      --hostname tdd-db
      --env NEO4J_AUTH=none
      --health-cmd "cypher-shell 'RETURN 1'"
      --health-interval 2s
      neo4j:5.12.0
    # Wait until Neo4J is ready (fail after 2 minutes)
    - timeout 120 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} tdd-db)" = healthy ]; do sleep 2; done'
    - >
      docker run
      -d
      --rm
      --name tdd-user-manager
      --network tdd
      --hostname tdd-user-manager
      --env NEO4J_URL=bolt://tdd-db
      --env JWT_SECRET=keyboardcat
      --health-cmd "curl -fs http://localhost/ > /dev/null"
      --health-interval 2s
      732469118990.dkr.ecr.ap-northeast-1.amazonaws.com/employee-manager:latest
    # Wait until the account manager is ready (fail after 2 minutes)
    - timeout 120 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} tdd-user-manager)" = healthy ]; do sleep 2; done'
  script:
    - >
      docker run
      --rm
      --name tdd-app
      --network tdd
      --env NEO4J_URL=bolt://tdd-db
      --env IDENTIFICATION_URL=http://tdd-user-manager/v3/users/self
      --env LOGIN_URL=http://tdd-user-manager/v3/auth/login
      --env TEST_USER_USERNAME=administrator
      --env TEST_USER_PASSWORD=administrator
      ${CONTAINER_IMAGE_TEST}
      npm run coverage

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker pull ${CONTAINER_IMAGE_TEST}
    # Tagging
    - docker tag ${CONTAINER_IMAGE_TEST} ${CONTAINER_IMAGE_TAGGED}
    - docker tag ${CONTAINER_IMAGE_TEST} ${CONTAINER_IMAGE_LATEST}
    # Pushing
    - docker push ${CONTAINER_IMAGE_TAGGED}
    - docker push ${CONTAINER_IMAGE_LATEST}

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - kubectl config use-context eks/gitlab-agent-for-kubernetes:eks
    - kubectl config set-context --current --namespace=moreillon
    - envsubst < kubernetes_manifest.yml | kubectl apply -f -
    - kubectl rollout status deployment/${APPLICATION_NAME} --timeout=120s
